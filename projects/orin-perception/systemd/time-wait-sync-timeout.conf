# Drop-in for systemd-time-wait-sync.service (installed by systemd/install.sh; copied from wk-hexapod).
# The stock unit waits forever; with no network the bench would never start.
# After 90 s the unit fails, time-sync.target is still reached, and the stack starts on
# the restored clock (wk-hexapod DEC-21; wk-robotics docs/common.md → Robot startup is familial, rule 7).
[Service]
TimeoutStartSec=90
